<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MochiAgent - Medical Analysis System</title>
    <style>
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-card: #252b3b;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-yellow: #d29922;
            --accent-red: #f85149;
            --border-color: #30363d;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Monaco, monospace;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-idle { background: var(--bg-secondary); color: var(--text-secondary); }
        .badge-running { background: rgba(88, 166, 255, 0.15); color: var(--accent-blue); }
        .badge-success { background: rgba(63, 185, 80, 0.15); color: var(--accent-green); }
        .badge-error { background: rgba(248, 81, 73, 0.15); color: var(--accent-red); }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.875rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .action-bar {
            margin-top: 1.5rem;
            display: flex;
            justify-content: flex-end;
        }

        button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: #fff;
        }

        .btn-primary:hover {
            background: #4393e6;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        .loader {
            width: 18px;
            height: 18px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .process-steps {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .step {
            display: flex;
            align-items: center;
            padding: 0.875rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.3s;
        }

        .step.pending {
            opacity: 0.5;
        }

        .step.running {
            border-color: var(--accent-blue);
            background: rgba(88, 166, 255, 0.05);
        }

        .step.completed {
            border-color: var(--accent-green);
            background: rgba(63, 185, 80, 0.05);
        }

        .step-indicator {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-right: 1rem;
            font-size: 0.75rem;
            font-weight: 700;
            background: var(--bg-card);
            color: var(--text-secondary);
        }

        .step.running .step-indicator {
            background: var(--accent-blue);
            color: #fff;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .step.completed .step-indicator {
            background: var(--accent-green);
            color: #fff;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .step-content {
            flex: 1;
        }

        .step-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .step-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .results-container {
            flex: 1;
            min-height: 200px;
            max-height: 400px;
            overflow: auto;
            padding: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .results-placeholder {
            color: var(--text-secondary);
            text-align: center;
            padding: 2rem;
        }

        .json-key { color: #7ee787; }
        .json-string { color: #a5d6ff; }
        .json-number { color: #79c0ff; }
        .json-boolean { color: #ff7b72; }
        .json-null { color: #ff7b72; }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>MochiAgent</h1>
            <p>Medical Agent System for EHR and Lab Test Analysis</p>
        </header>

        <div class="main-grid">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Input Data</h2>
                </div>
                <div class="input-group">
                    <label for="inputData">JSON Data (EHR and Lab Tests)</label>
                    <textarea id="inputData" spellcheck="false">{
    "ehr": [
        "Patient 45M, history of T2DM.",
        "Presenting with fatigue and polyuria.",
        "BMI 28.5, Blood pressure 140/90."
    ],
    "lab_tests": [
        [126, 7.2, 180, 45, 150],
        [135, 7.5, 175, 42, 160],
        [142, 7.8, 185, 40, 170]
    ]
}</textarea>
                </div>
                <div class="action-bar">
                    <button id="analyzeBtn" class="btn-primary" onclick="runAnalysis()">
                        <span class="loader" id="btnLoader"></span>
                        <span id="btnText">Run Analysis</span>
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Analysis Pipeline</h2>
                    <span id="statusBadge" class="badge badge-idle">Ready</span>
                </div>

                <div class="process-steps" id="processSteps"></div>

                <div class="results-container" id="results">
                    <div class="results-placeholder">
                        Results will appear here after analysis...
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>MochiAgent v1.0 | <a href="/docs">API Documentation</a></p>
        </footer>
    </div>

    <script>
        const STEPS = [
            "Transformer Inference",
            "Web Search & Reasoning",
            "Trajectory Inference",
            "Clustering"
        ];

        function initSteps() {
            const container = document.getElementById('processSteps');
            container.innerHTML = '';
            STEPS.forEach((step, index) => {
                const stepEl = document.createElement('div');
                stepEl.className = 'step pending';
                stepEl.id = `step-${index}`;
                stepEl.innerHTML = `
                    <div class="step-indicator">${index + 1}</div>
                    <div class="step-content">
                        <div class="step-title">${step}</div>
                        <div class="step-status">Pending</div>
                    </div>
                `;
                container.appendChild(stepEl);
            });
        }

        function updateStep(stepName, status) {
            const index = STEPS.indexOf(stepName);
            if (index === -1) return;

            const stepEl = document.getElementById(`step-${index}`);
            stepEl.className = `step ${status}`;
            
            const statusText = stepEl.querySelector('.step-status');
            if (status === 'running') {
                statusText.textContent = 'Processing...';
            } else if (status === 'completed') {
                statusText.textContent = 'Completed';
            }
        }

        async function runAnalysis() {
            const inputField = document.getElementById('inputData');
            const resultsField = document.getElementById('results');
            const btn = document.getElementById('analyzeBtn');
            const btnLoader = document.getElementById('btnLoader');
            const btnText = document.getElementById('btnText');
            const statusBadge = document.getElementById('statusBadge');

            resultsField.innerHTML = '';
            btn.disabled = true;
            btnLoader.style.display = 'block';
            btnText.textContent = 'Processing...';
            statusBadge.className = 'badge badge-running';
            statusBadge.textContent = 'Processing';
            initSteps();

            try {
                let data;
                try {
                    data = JSON.parse(inputField.value);
                } catch (e) {
                    throw new Error("Invalid JSON format");
                }

                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error(`Server Error (${response.status})`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const event = JSON.parse(line);
                            handleEvent(event);
                        } catch (e) {
                            console.error('Parse error:', e);
                        }
                    }
                }

                statusBadge.className = 'badge badge-success';
                statusBadge.textContent = 'Complete';

            } catch (e) {
                resultsField.innerHTML = `<span style="color: var(--accent-red)">Error: ${e.message}</span>`;
                statusBadge.className = 'badge badge-error';
                statusBadge.textContent = 'Error';
            } finally {
                btn.disabled = false;
                btnLoader.style.display = 'none';
                btnText.textContent = 'Run Analysis';
            }
        }

        function handleEvent(event) {
            if (event.type === 'progress') {
                updateStep(event.step, event.status);
            } else if (event.type === 'result') {
                const resultsField = document.getElementById('results');
                resultsField.innerHTML = syntaxHighlight(event.data);
            } else if (event.type === 'error') {
                const resultsField = document.getElementById('results');
                resultsField.innerHTML += `<div style="color: var(--accent-red)">Error: ${event.message}</div>`;
            }
        }

        function syntaxHighlight(json) {
            if (typeof json !== 'string') {
                json = JSON.stringify(json, null, 2);
            }
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    cls = /:$/.test(match) ? 'json-key' : 'json-string';
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        initSteps();
    </script>
</body>
</html>
