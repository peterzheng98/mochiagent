<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Agent Interface</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #10b981;
            --error-color: #ef4444;
            --processing-color: #f59e0b;
            --font-mono: 'Menlo', 'Monaco', 'Courier New', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem;
            min-height: 100vh;
        }

        .header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .header h1 {
            font-weight: 700;
            font-size: 2.5rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
            letter-spacing: -0.05em;
        }

        .header p {
            color: #64748b;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (min-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            height: 100%;
        }

        .card-header {
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #334155;
        }

        .input-group {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #64748b;
        }

        textarea {
            width: 100%;
            height: 200px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #f1f5f9;
            color: #334155;
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background-color: #fff;
        }

        .action-bar {
            margin-top: 1.5rem;
            display: flex;
            justify-content: flex-end;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results-container {
            background-color: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            overflow: auto;
            flex-grow: 1;
            min-height: 200px;
            border: 1px solid #334155;
            max-height: 500px;
        }

        .status-bar {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-idle {
            background-color: #e2e8f0;
            color: #64748b;
        }

        .status-loading {
            background-color: #bae6fd;
            color: #0284c7;
        }

        .status-success {
            background-color: #bbf7d0;
            color: #16a34a;
        }

        .status-error {
            background-color: #fecaca;
            color: #dc2626;
        }

        /* Loader */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Process Steps */
        .process-steps {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .step {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        .step.pending {
            border-left: 4px solid #cbd5e1;
            opacity: 0.6;
        }

        .step.running {
            border-left: 4px solid var(--processing-color);
            background-color: #fffbeb;
            box-shadow: 0 2px 4px rgba(245, 158, 11, 0.1);
        }

        .step.completed {
            border-left: 4px solid var(--success-color);
            background-color: #f0fdf4;
        }

        .step-icon {
            margin-right: 1rem;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e2e8f0;
            color: #64748b;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .step.running .step-icon {
            background: var(--processing-color);
            color: white;
            animation: pulse 1.5s infinite;
        }

        .step.completed .step-icon {
            background: var(--success-color);
            color: white;
        }

        .step-content {
            flex-grow: 1;
        }

        .step-title {
            font-weight: 600;
            color: #334155;
            font-size: 0.95rem;
        }

        .step-status {
            font-size: 0.8rem;
            color: #64748b;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .json-key {
            color: #9cdcfe;
        }

        .json-string {
            color: #ce9178;
        }

        .json-number {
            color: #b5cea8;
        }

        .json-boolean {
            color: #569cd6;
        }

        .json-null {
            color: #569cd6;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: #94a3b8;
            font-size: 0.875rem;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Medical Agent Interface</h1>
        <p>Advanced EHR & Lab Test Analysis System</p>
    </div>

    <div class="main-container">
        <!-- Input Section -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">Input Configuration</div>
            </div>
            <div class="input-group">
                <label for="inputData">JSON Data (EHR & Lab Tests)</label>
                <textarea id="inputData" spellcheck="false">{
    "ehr": [
        "Patient 45M, history of T2DM.",
        "Presenting with fatigue and polyuria."
    ],
    "lab_tests": [
        [100, 20, 30],
        [110, 22, 32],
        [105, 21, 31]
    ]
}</textarea>
            </div>
            <div class="action-bar">
                <button id="analyzeBtn" onclick="runAnalysis()">
                    <span class="loader" id="btnLoader"></span>
                    <span id="btnText">Run Analysis</span>
                </button>
            </div>
        </div>

        <!-- Process & Results Section -->
        <div class="card">
            <div class="card-header">
                <div class="status-bar">
                    <div class="card-title">Agent Process & Results</div>
                    <span id="statusBadge" class="status-badge status-idle">Ready</span>
                </div>
            </div>

            <div class="process-steps" id="processSteps">
                <!-- Steps will be injected here -->
            </div>

            <div class="results-container" id="results">
                <div style="color: #64748b; text-align: center; padding-top: 2rem;">
                    Waiting for analysis...
                </div>
            </div>
        </div>
    </div>

    <footer>
        System v1.0 | No Emoji Policy Enforced
    </footer>

    <script>
        const STEPS = [
            "Transformer Inference",
            "Web Search & Reasoning",
            "Trajectory Inference",
            "Clustering"
        ];

        function initSteps() {
            const container = document.getElementById('processSteps');
            container.innerHTML = '';
            STEPS.forEach((step, index) => {
                const stepEl = document.createElement('div');
                stepEl.className = 'step pending';
                stepEl.id = `step-${index}`;
                stepEl.innerHTML = `
                    <div class="step-icon">${index + 1}</div>
                    <div class="step-content">
                        <div class="step-title">${step}</div>
                        <div class="step-status">Pending</div>
                    </div>
                `;
                container.appendChild(stepEl);
            });
        }

        function updateStep(stepName, status, details) {
            const index = STEPS.indexOf(stepName);
            if (index === -1) return;

            const stepEl = document.getElementById(`step-${index}`);
            stepEl.className = `step ${status}`;

            const statusText = stepEl.querySelector('.step-status');
            if (status === 'running') {
                statusText.textContent = 'Processing...';
            } else if (status === 'completed') {
                statusText.textContent = 'Completed';
            } else if (status === 'error') {
                statusText.textContent = 'Error';
            }
        }

        async function runAnalysis() {
            const inputField = document.getElementById('inputData');
            const resultsField = document.getElementById('results');
            const btn = document.getElementById('analyzeBtn');
            const btnLoader = document.getElementById('btnLoader');
            const btnText = document.getElementById('btnText');
            const statusBadge = document.getElementById('statusBadge');

            // Reset UI
            resultsField.innerHTML = '';
            btn.disabled = true;
            btnLoader.style.display = 'block';
            btnText.textContent = 'Processing...';
            statusBadge.className = 'status-badge status-loading';
            statusBadge.textContent = 'Processing';
            initSteps();

            try {
                let data;
                try {
                    data = JSON.parse(inputField.value);
                } catch (e) {
                    throw new Error("Invalid JSON format in input.");
                }

                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error(`Server Error (${response.status})`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // Keep incomplete line in buffer

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const event = JSON.parse(line);
                            handleEvent(event);
                        } catch (e) {
                            console.error('Error parsing JSON stream', e);
                        }
                    }
                }

                statusBadge.className = 'status-badge status-success';
                statusBadge.textContent = 'Complete';

            } catch (e) {
                resultsField.innerHTML = `<span style="color: #ef4444;">Error: ${e.message}</span>`;
                statusBadge.className = 'status-badge status-error';
                statusBadge.textContent = 'Error';
            } finally {
                btn.disabled = false;
                btnLoader.style.display = 'none';
                btnText.textContent = 'Run Analysis';
            }
        }

        function handleEvent(event) {
            if (event.type === 'progress') {
                updateStep(event.step, event.status, event.details);
            } else if (event.type === 'result') {
                const resultsField = document.getElementById('results');
                resultsField.innerHTML = syntaxHighlight(event.data);
            } else if (event.type === 'error') {
                const resultsField = document.getElementById('results');
                resultsField.innerHTML += `<div style="color: red; margin-top: 10px;">Error: ${event.message}</div>`;
            }
        }

        function syntaxHighlight(json) {
            if (typeof json != 'string') {
                json = JSON.stringify(json, undefined, 2);
            }
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                var cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        // Init steps on load
        initSteps();
    </script>
</body>

</html>
